<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tadaaki Matsuzaka | Achievements</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #f5f5f7;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            overflow-x: hidden;
            cursor: none; 
        }

        #cursor {
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            transform: translate(-50%, -50%);
            transition: transform 0.1s ease;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
        }

        .pub-card {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 10;
        }
        .pub-card:hover {
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
            padding-left: 1.5rem;
        }

        .timeline-line {
            position: absolute;
            left: 1.5rem;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
        }

        .year-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.2), transparent);
            margin: 3rem 0 1rem 0;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        a, button, .cursor-pointer {
            cursor: none;
        }
    </style>
</head>
<body class="custom-scrollbar">

    <div id="cursor"></div>

    <!-- NAVIGATION -->
    <nav class="fixed top-0 w-full z-50 px-8 py-6 mix-blend-difference">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-sm font-bold tracking-[0.3em] uppercase">Tadaaki Matsuzaka / The University of OSAKA</span>
            <div class="hidden md:flex gap-8 text-[10px] font-bold tracking-widest uppercase text-gray-400 items-center">
                <a href="#" class="nav-link hover:text-white transition-colors">Home</a>
                <a href="#achievements" class="nav-link text-white border-b border-white">Achievements</a>
                <a href="https://researchmap.jp/tadaaki_matsuzaka" target="_blank" class="nav-link hover:text-white transition-colors flex items-center gap-1">
                    ResearchMap 
                    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
                </a>
                <a href="http://www.mat.eng.osaka-u.ac.jp/msp6/nakano/" target="_blank" class="nav-link hover:text-white transition-colors flex items-center gap-1">
                    Nakano Lab
                    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/></svg>
                </a>
            </div>
        </div>
    </nav>

    <main class="pt-48 pb-20 px-8 relative z-10">
        <section id="achievements" class="max-w-5xl mx-auto">
            <!-- HEADER (タイトル) -->
            <header class="mb-32 reveal" style="opacity: 1; transform: translateY(0);">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-8 h-px bg-gray-500"></div>
                    <span class="text-xs uppercase tracking-[0.5em] text-gray-500 block">Archive</span>
                </div>
                <h1 class="text-6xl md:text-8xl font-black tracking-tighter text-white uppercase leading-none">Selected<br>Achievements.</h1>
            </header>

            <div id="achievement-sections" class="space-y-40">
                <div class="flex flex-col items-center justify-center py-20" id="loading-spinner">
                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-white mb-4"></div>
                    <p class="text-[10px] uppercase tracking-widest text-gray-500">Connecting to achievements.csv...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-20 border-t border-white/10 text-center">
        <p class="text-gray-600 text-[10px] tracking-[0.3em] uppercase">© 2026 Tadaaki Matsuzaka. The University of OSAKA.</p>
    </footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            gsap.to(cursor, {
                x: e.clientX,
                y: e.clientY,
                duration: 0.1,
                ease: "power2.out"
            });
        });

        const setupCursorInteractions = () => {
            const interactiveElements = 'a, button, .cursor-pointer, .pub-card';
            document.querySelectorAll(interactiveElements).forEach(el => {
                el.addEventListener('mouseenter', () => {
                    gsap.to(cursor, { scale: 3, opacity: 0.2, duration: 0.3 });
                });
                el.addEventListener('mouseleave', () => {
                    gsap.to(cursor, { scale: 1, opacity: 0.5, duration: 0.3 });
                });
            });
        };

        async function init() {
            let items = [];
            const container = document.getElementById('achievement-sections');

            try {
                const response = await fetch('achievements.csv');
                if (!response.ok) throw new Error('CSV not found');

                const csvText = await response.text();
                const rows = csvText.split('\n').filter(row => row.trim() !== '');
                
                items = rows.slice(1).map(row => {
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(col => col.trim().replace(/^"|"$/g, ''));
                    return {
                        category: columns[0] || "Other",
                        year: columns[1] || "",
                        title: columns[2] || "",
                        summary: columns[3] || "",
                        info: columns[4] || "",
                        link: columns[5] || ""
                    };
                });
            } catch (error) {
                console.warn("CSV load failed.", error);
                container.innerHTML = `
                    <div class="text-center py-20 border border-dashed border-white/10 rounded-xl">
                        <p class="text-gray-500 text-sm mb-4">achievements.csv could not be loaded.</p>
                        <p class="text-[10px] uppercase tracking-widest text-gray-700">Please ensure the file exists in the same directory.</p>
                    </div>
                `;
                setupAnimations(); // ヘッダーのみアニメーション実行
                return;
            }

            const loadingSpinner = document.getElementById('loading-spinner');
            if (loadingSpinner) loadingSpinner.remove();
            
            if (items.length > 0) {
                renderAchievements(items);
                setupAnimations();
                setupCursorInteractions();
            } else {
                container.innerHTML = '<p class="text-center text-gray-500">No data found in CSV.</p>';
                setupAnimations();
            }
        }

        function renderAchievements(items) {
            const container = document.getElementById('achievement-sections');
            const categories = [...new Set(items.map(i => i.category))];

            categories.forEach(catName => {
                const catSection = document.createElement('div');
                catSection.className = 'reveal relative';
                
                let html = `
                    <div class="flex items-center gap-6 mb-16">
                        <h3 class="text-2xl font-black uppercase tracking-[0.2em] text-white">${catName}</h3>
                        <div class="h-px flex-1 bg-white/10"></div>
                    </div>
                    <div class="timeline-line hidden md:block"></div>
                `;
                
                const catItems = items.filter(i => i.category === catName);
                html += `<div class="space-y-0">`;
                
                let lastYear = null;
                catItems.forEach((item, index) => {
                    const showYear = (item.year && item.year !== lastYear);
                    lastYear = item.year;
                    const yearDivider = (showYear && index !== 0) ? `<div class="year-divider ml-8"></div>` : '';

                    html += `
                        ${yearDivider}
                        <div class="pub-card p-10 group flex flex-col md:flex-row md:items-start gap-8 relative cursor-pointer" 
                             ${item.link ? `onclick="window.open('${item.link}', '_blank')"` : ''}>
                            <div class="min-w-[100px] pt-1">
                                ${showYear ? `<span class="text-3xl font-black text-white font-mono tracking-tighter">${item.year}</span>` : ''}
                            </div>
                            <div class="flex-1">
                                <h4 class="text-xl md:text-2xl font-bold text-white/90 group-hover:text-white transition-colors mb-3 leading-snug">
                                    ${item.title}
                                </h4>
                                <p class="text-sm text-white/50 mb-4 italic">${item.info}</p>
                                <p class="text-xs text-gray-500 font-medium uppercase tracking-wider">
                                    <span class="text-gray-700 mr-2">Authors:</span>${item.summary}
                                </p>
                            </div>
                            ${item.link ? `
                                <div class="self-end md:self-center">
                                    <div class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center group-hover:bg-white group-hover:text-black transition-all">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
                html += `</div>`;
                catSection.innerHTML = html;
                container.appendChild(catSection);
            });
        }

        function setupAnimations() {
            gsap.utils.toArray('.reveal').forEach(el => {
                gsap.to(el, {
                    scrollTrigger: {
                        trigger: el,
                        start: "top 90%",
                        toggleActions: "play none none none"
                    },
                    opacity: 1,
                    y: 0,
                    duration: 1.2,
                    ease: "power3.out"
                });
            });
        }

        window.onload = init;
    </script>
</body>
</html>
