<script>
        gsap.registerPlugin(ScrollTrigger);

        // 各カテゴリーで最初に表示する件数
        const INITIAL_DISPLAY_COUNT = 3;

        async function init() {
            try {
                const response = await fetch('achievements.csv');
                const csvData = await response.text();
                
                // CSVパース（簡易版）
                const rows = csvData.split('\n').map(row => {
                    // カンマ区切りの対応（引用符などは考慮しない簡易分割）
                    return row.split(',').map(cell => cell.trim());
                });
                
                const headers = rows[0];
                const data = rows.slice(1).filter(row => row.length >= 3 && row[0] !== "");

                const items = data.map(row => ({
                    category: row[0],
                    year: row[1],
                    title: row[2],
                    summary: row[3] || "", // 画像の「Name（著者名）」などを想定
                    info: row[4] || "",
                    link: row[5] || ""
                }));

                renderAchievements(items);
                setupAnimations();
            } catch (error) {
                console.error("CSV読み込みエラー:", error);
                document.getElementById('achievement-sections').innerHTML = "<p class='text-red-500'>CSVの読み込みに失敗しました。</p>";
            }
        }

        function renderAchievements(items) {
            const container = document.getElementById('achievement-sections');
            const categories = [...new Set(items.map(i => i.category))];

            categories.forEach(catName => {
                const catSection = document.createElement('div');
                catSection.className = 'reveal mb-32';
                catSection.id = `section-${catName}`;
                
                // カテゴリー名を大きく強調
                let html = `<h3 class="text-3xl font-black border-b-2 border-white/20 pb-6 mb-10 text-white uppercase tracking-tighter">${catName}</h3>`;
                
                const catItems = items.filter(i => i.category === catName);
                // 全件をレンダリングするが、4件目以降は隠しておく
                html += `<div class="items-wrapper">`;
                
                catItems.forEach((item, index) => {
                    const isHidden = index >= INITIAL_DISPLAY_COUNT ? 'hidden' : '';
                    html += `
                        <div class="pub-card py-8 group flex flex-col md:flex-row md:items-start justify-between gap-6 ${isHidden}" data-extra-item>
                            <div class="max-w-4xl">
                                <div class="text-sm text-gray-500 mb-2 font-mono">${item.year}</div>
                                <h4 class="text-xl font-bold group-hover:text-white transition-colors mb-2">${item.title}</h4>
                                <p class="text-gray-400 text-sm mb-3 italic leading-relaxed">${item.summary}</p>
                                <p class="text-[10px] text-gray-600 uppercase tracking-widest leading-loose">${item.info}</p>
                            </div>
                            ${item.link ? `
                            <a href="${item.link}" target="_blank" class="w-10 h-10 rounded-full border border-thin flex items-center justify-center hover:bg-white hover:text-black transition-all shrink-0">→</a>
                            ` : ''}
                        </div>
                    `;
                });

                html += `</div>`;

                // 3件より多い場合のみ More ボタンを表示
                if (catItems.length > INITIAL_DISPLAY_COUNT) {
                    html += `
                        <button onclick="toggleMore(this)" class="mt-12 group flex items-center gap-4 text-xs font-bold uppercase tracking-[0.3em] text-gray-400 hover:text-white transition-colors">
                            <span>More Achievements</span>
                            <span class="w-8 h-px bg-gray-600 group-hover:bg-white group-hover:w-12 transition-all"></span>
                        </button>
                    `;
                }

                catSection.innerHTML = html;
                container.appendChild(catSection);
            });
        }

        // Moreボタンの挙動
        function toggleMore(button) {
            const wrapper = button.previousElementSibling;
            const extraItems = wrapper.querySelectorAll('[data-extra-item].hidden');
            
            // 全ての隠れているアイテムを表示
            extraItems.forEach(item => {
                item.classList.remove('hidden');
                // ふわっと表示させるアニメーション
                gsap.fromTo(item, {opacity: 0, y: 10}, {opacity: 1, y: 0, duration: 0.5});
            });

            // ボタンを消す（またはテキストを変える）
            button.style.display = 'none';
            
            // スクロール位置の再計算（GSAP用）
            ScrollTrigger.refresh();
        }

        function setupAnimations() {
            gsap.utils.toArray('.reveal').forEach(el => {
                gsap.to(el, {
                    scrollTrigger: { trigger: el, start: "top 90%" },
                    opacity: 1, y: 0, duration: 1, ease: "power3.out"
                });
            });
        }

        window.onload = init;
    </script>
