<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Achievements | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e5e5e5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .reveal {
            opacity: 0;
            transform: translateY(30px);
        }
        .pub-card {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .pub-card:hover {
            background-color: rgba(255, 255, 255, 0.02);
            border-bottom-color: rgba(255, 255, 255, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }
        /* タイムラインの縦ライン */
        .timeline-line {
            position: absolute;
            left: 1.5rem;
            top: 0;
            bottom: 0;
            width: 1px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.05) 100%);
        }
        /* 年の切り替わり線のスタイル - 左側の余白を詰めて調整 */
        .year-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.3), transparent);
            margin: 3rem 0 1rem 0;
        }
    </style>
</head>
<body class="custom-scrollbar">

    <nav class="fixed top-0 w-full z-50 px-8 py-6 mix-blend-difference">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <span class="text-xl font-black tracking-tighter uppercase">Portfolio.</span>
            <div class="hidden md:flex gap-8 text-xs font-bold tracking-widest uppercase text-gray-400">
                <a href="#" class="hover:text-white transition-colors">Home</a>
                <a href="#achievements" class="hover:text-white transition-colors text-white">Achievements</a>
                <a href="#" class="hover:text-white transition-colors">Contact</a>
            </div>
        </div>
    </nav>

    <main class="pt-40 pb-20 px-6">
        <section id="achievements" class="max-w-5xl mx-auto">
            <header class="mb-24 reveal">
                <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-4 text-white uppercase">Achievements</h1>
            </header>

            <div id="achievement-sections" class="space-y-32">
                <div class="flex justify-center py-20" id="loading-spinner">
                    <div class="animate-spin rounded-full h-8 w-8 border-t-2 border-white"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="py-20 border-t border-white/10 text-center">
        <p class="text-gray-600 text-xs tracking-widest uppercase font-mono">© 2026 Your Name.</p>
    </footer>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        const INITIAL_DISPLAY_COUNT = 3;

        const MOCK_DATA = [
            ["Papers", "2024", "Advancements in Artificial Intelligence Structure", "John Doe, Jane Smith", "International Conference on AI (ICAI), Tokyo", "https://example.com"],
            ["Papers", "2024", "Future of Machine Learning", "John Doe", "Journal of AI Research", "https://example.com"],
            ["Papers", "2023", "Deep Learning in Modern Web Architectures", "John Doe", "Journal of Web Technologies, Vol. 12", "https://example.com"],
            ["Papers", "2023", "Responsive Design Patterns", "Jane Smith", "UX Design Review", ""],
            ["Awards", "2024", "Best Innovation Award", "University of Excellence", "Annual Tech Expo 2024", ""],
            ["Awards", "2023", "Young Researcher Grant", "Science Foundation", "Grant Award Ceremony", "https://example.com"]
        ];

        async function init() {
            try {
                let items = [];
                const response = await fetch('achievements.csv').catch(() => null);

                if (response && response.ok) {
                    const csvData = await response.text();
                    const rows = csvData.split('\n').map(row => row.split(',').map(cell => cell.trim()));
                    const data = rows.slice(1).filter(row => row.length >= 3 && row[0] !== "");
                    items = data.map(row => ({
                        category: row[0],
                        year: row[1],
                        title: row[2],
                        summary: row[3] || "", 
                        info: row[4] || "",    
                        link: row[5] || ""
                    }));
                } else {
                    console.warn("CSV not found. Loading mock data...");
                    items = MOCK_DATA.map(row => ({
                        category: row[0],
                        year: row[1],
                        title: row[2],
                        summary: row[3] || "",
                        info: row[4] || "",
                        link: row[5] || ""
                    }));
                }

                document.getElementById('loading-spinner')?.remove();
                renderAchievements(items);
                setupAnimations();

            } catch (error) {
                console.error("Initialization error:", error);
                document.getElementById('achievement-sections').innerHTML = "<p class='text-red-500 font-mono'>Error loading data.</p>";
            }
        }

        function renderAchievements(items) {
            const container = document.getElementById('achievement-sections');
            const categories = [...new Set(items.map(i => i.category))];

            categories.forEach(catName => {
                const catSection = document.createElement('div');
                catSection.className = 'reveal relative';
                catSection.id = `section-${catName.toLowerCase()}`;
                
                let html = `
                    <div class="flex items-center gap-6 mb-12">
                        <h3 class="text-3xl font-black uppercase tracking-widest text-white">${catName}</h3>
                        <div class="h-px flex-1 bg-white/10"></div>
                        <span class="text-[10px] text-gray-600 font-mono uppercase tracking-[0.2em]">${items.filter(i => i.category === catName).length} items</span>
                    </div>
                    <div class="timeline-line hidden md:block"></div>
                `;
                
                const catItems = items.filter(i => i.category === catName);
                html += `<div class="items-wrapper space-y-0">`;
                
                let lastYear = null;

                catItems.forEach((item, index) => {
                    const isHidden = index >= INITIAL_DISPLAY_COUNT ? 'hidden' : '';
                    const showYear = item.year !== lastYear;
                    lastYear = item.year;

                    const titleContent = item.link 
                        ? `<a href="${item.link}" target="_blank" class="hover:text-white transition-all underline underline-offset-8 decoration-white/0 hover:decoration-white/40">${item.title}</a>`
                        : item.title;

                    // 年が切り替わる際にデバイダー（線）を挿入 - 左側のマージンを調整
                    const yearDivider = (showYear && index !== 0) ? `<div class="year-divider ml-4 md:ml-8"></div>` : '';

                    html += `
                        ${yearDivider}
                        <div class="pub-card p-8 group flex flex-col md:flex-row md:items-start gap-6 md:gap-12 relative ${isHidden}" data-extra-item>
                            <!-- 年表記 -->
                            <div class="relative flex flex-col pt-1 min-w-[100px] z-10">
                                ${showYear ? `
                                    <span class="text-3xl font-black text-white font-mono leading-none tracking-tighter bg-[#0a0a0a] pr-2 inline-block">${item.year}</span>
                                    <span class="text-[9px] text-gray-600 uppercase tracking-widest mt-2 font-bold bg-[#0a0a0a] pr-2 inline-block italic">New Year</span>
                                ` : `
                                    <div class="h-8 w-px bg-transparent"></div>
                                `}
                            </div>

                            <div class="flex-1 flex flex-col">
                                <!-- 1. タイトル -->
                                <h4 class="text-xl md:text-2xl font-bold text-white/95 group-hover:text-white transition-colors mb-2 leading-tight">
                                    ${titleContent}
                                </h4>

                                <!-- 2. 雑誌名・学会名 -->
                                <div class="mb-3">
                                    <p class="text-sm md:text-base font-semibold text-white/60 group-hover:text-white transition-colors italic">
                                        ${item.info}
                                    </p>
                                </div>

                                <!-- 3. 著者 -->
                                <div class="mt-auto">
                                    <p class="text-gray-500 text-sm font-medium">
                                        <span class="text-[9px] uppercase font-bold tracking-widest text-gray-700 mr-2 border-b border-gray-800">Authors:</span>${item.summary}
                                    </p>
                                </div>
                            </div>

                            <div class="flex items-center self-end md:self-center">
                                ${item.link ? `
                                <a href="${item.link}" target="_blank" class="w-12 h-12 rounded-full border border-white/5 flex items-center justify-center hover:bg-white hover:text-black hover:scale-110 hover:border-white transition-all duration-500 shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                                </a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;

                if (catItems.length > INITIAL_DISPLAY_COUNT) {
                    html += `
                        <button onclick="toggleMore(this)" class="mt-12 group flex items-center gap-4 py-4 px-1 text-[10px] font-black uppercase tracking-[0.5em] text-gray-500 hover:text-white transition-all ml-4 md:ml-32">
                            <span class="w-8 h-px bg-gray-800 group-hover:bg-white group-hover:w-16 transition-all duration-500"></span>
                            <span>Expand All ${catName}</span>
                        </button>
                    `;
                }

                catSection.innerHTML = html;
                container.appendChild(catSection);
            });
        }

        function toggleMore(button) {
            const wrapper = button.previousElementSibling;
            const extraItems = wrapper.querySelectorAll('[data-extra-item].hidden');
            
            extraItems.forEach((item, idx) => {
                item.classList.remove('hidden');
                gsap.fromTo(item, 
                    { opacity: 0, y: 20 }, 
                    { opacity: 1, y: 0, duration: 0.8, delay: idx * 0.08, ease: "expo.out" }
                );
            });

            gsap.to(button, { opacity: 0, y: 10, duration: 0.3, onComplete: () => {
                button.remove();
                ScrollTrigger.refresh();
            }});
        }

        function setupAnimations() {
            gsap.utils.toArray('.reveal').forEach(el => {
                gsap.to(el, {
                    scrollTrigger: {
                        trigger: el,
                        start: "top 90%",
                        toggleActions: "play none none none"
                    },
                    opacity: 1,
                    y: 0,
                    duration: 1.5,
                    ease: "expo.out"
                });
            });
        }

        window.onload = init;
    </script>
</body>
</html>
